name = "chicking-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "chicking-leads"
database_id = "REDACTED"

# Replay leads saved while n8n was down (forward_status pending/failed). Every 15 min.
[triggers]
crons = ["*/15 * * * *"]

[vars]
N8N_WEBHOOK_URL = "https://<n8n-host>/webhook/chicking-lead-intake"
LANDING_ORIGIN  = "https://chicking-mohali.pages.dev"
DASHBOARD_ORIGIN = "https://chicking-dashboard.pages.dev"
